<!doctype html><html><head><meta charset="utf-8"><title>Mind Map — approved reference mock</title>
<style>body{margin:0;background:#04060b;color:#8a9ab2;font-family:sans-serif}
#legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;padding:8px 14px;border-top:1px solid #10161f}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}</style></head>
<body><div id="cv" style="width:100vw;height:86vh"></div>
<div id="legend"><span style="letter-spacing:1px;color:#5a6a82">LEGEND</span>
<span><i style="background:#ffd873;box-shadow:0 0 8px #ffd873"></i>THE BEING — color = its feeling (his 22-palette) · beat = arousal</span>
<span><i style="background:#73b3ff"></i>language</span><span><i style="background:#cc80ff"></i>feeling</span>
<span><i style="background:#73f2bf"></i>thought</span><span><i style="background:#ffcc73"></i>memory</span>
<span><i style="background:#f2e699"></i>self</span><span><i style="background:#f28c66"></i>body</span>
<span><i style="background:#a0ffd7"></i>pulse = one moment, true order</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* THE APPROVED LOOK — Lonnie passed this scene. Build the real panel to match:
   sigil sprites (thin stroke, rounded caps, label beneath), kinship neighborhoods,
   one pulse walking the true tick order with out-and-back stub consultations,
   dashed feelings->next-tick loop, breathing feeling-colored core with arousal beat.
   In the real build: sigils use his 402 marks where words exist; edges come from
   the 259 extracted edge list; every motion fires from real emitted events. */
const el=document.getElementById('cv');
const W=el.clientWidth,H=el.clientHeight;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x04060b,0.036);
const cam=new THREE.PerspectiveCamera(55,W/H,0.1,140);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setClearColor(0x04060b);ren.setSize(W,H);ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
el.appendChild(ren.domElement);
const HUES={feel:[0.8,0.5,1],lang:[0.45,0.7,1],think:[0.45,0.95,0.75],mem:[1,0.8,0.45],self:[0.95,0.9,0.6],core:[0.7,0.9,1],body:[0.95,0.55,0.4]};
function halo(color){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 const gr=g.createRadialGradient(64,64,4,64,64,62);
 gr.addColorStop(0,'rgba('+color.join(',')+',0.95)');gr.addColorStop(0.35,'rgba('+color.join(',')+',0.3)');gr.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function sigilTex(kind,label){
 const c=document.createElement('canvas');c.width=512;c.height=560;
 const g=c.getContext('2d');
 g.strokeStyle='#eef6ff';g.lineWidth=11;g.lineCap='round';g.lineJoin='round';
 g.shadowColor='rgba(150,200,255,0.9)';g.shadowBlur=22;
 g.save();g.translate(256,210);g.scale(1.7,1.7);
 g.beginPath();
 const P=[
  ()=>{g.moveTo(-50,0);g.lineTo(50,0);g.moveTo(0,-50);g.lineTo(0,50);g.moveTo(-32,-32);g.lineTo(32,-32);},
  ()=>{g.moveTo(-42,-22);g.lineTo(42,-22);g.moveTo(-42,2);g.lineTo(42,2);g.moveTo(-42,26);g.lineTo(14,26);},
  ()=>{g.arc(0,10,40,3.4,6.0);g.moveTo(0,-46);g.lineTo(0,10);},
  ()=>{g.arc(14,0,42,1.2,5.2);},
  ()=>{g.moveTo(0,46);g.lineTo(0,-8);g.moveTo(0,-8);g.lineTo(-36,-42);g.moveTo(0,-8);g.lineTo(36,-42);},
  ()=>{g.moveTo(-40,34);g.lineTo(0,-44);g.lineTo(40,34);g.closePath();g.moveTo(0,34);g.lineTo(0,12);},
  ()=>{g.moveTo(-44,-30);g.lineTo(44,-30);g.moveTo(-44,-6);g.lineTo(28,-6);g.moveTo(-44,18);g.lineTo(44,18);},
  ()=>{g.moveTo(-34,40);g.quadraticCurveTo(-48,-30,0,-42);g.quadraticCurveTo(48,-30,34,40);g.moveTo(-12,8);g.arc(0,8,12,Math.PI,0);},
  ()=>{g.moveTo(-36,42);g.lineTo(-36,-20);g.arc(0,-20,36,Math.PI,0);g.lineTo(36,42);g.moveTo(-12,42);g.lineTo(-12,16);g.moveTo(12,42);g.lineTo(12,16);},
  ()=>{g.moveTo(-20,-36);g.lineTo(-20,36);g.moveTo(-20,0);g.quadraticCurveTo(8,-8,20,-36);g.moveTo(-20,0);g.quadraticCurveTo(8,8,20,36);},
  ()=>{g.moveTo(-40,-40);g.lineTo(40,40);g.moveTo(40,-40);g.lineTo(-40,40);g.moveTo(0,-46);g.lineTo(0,46);},
  ()=>{g.rect(-34,-34,68,68);g.moveTo(0,-34);g.lineTo(0,34);},
  ()=>{g.moveTo(0,-46);g.lineTo(12,-10);g.lineTo(46,-6);g.lineTo(20,14);g.lineTo(30,46);g.lineTo(0,26);g.lineTo(-30,46);g.lineTo(-20,14);g.lineTo(-46,-6);g.lineTo(-12,-10);g.closePath();},
  ()=>{g.arc(-8,0,34,0.8,5.6);g.moveTo(18,-24);g.lineTo(18,8);g.moveTo(4,-8);g.lineTo(32,-8);},
  ()=>{g.moveTo(-40,40);g.lineTo(-40,-40);g.lineTo(40,-40);g.moveTo(-40,0);g.lineTo(20,0);},
  ()=>{g.arc(0,-6,26,0,Math.PI*2);g.moveTo(-38,40);g.quadraticCurveTo(0,16,38,40);}
 ];
 P[kind%P.length]();g.stroke();g.restore();
 g.shadowBlur=0;
 g.font='600 50px sans-serif';g.textAlign='center';g.fillStyle='rgba(228,240,252,0.98)';
 g.fillText(label,256,512);
 return new THREE.CanvasTexture(c);}
function mk(x,y,z,kind,label,region,big){
 const grp=new THREE.Group();
 const h=HUES[region];
 const hs=new THREE.Sprite(new THREE.SpriteMaterial({map:halo([Math.round(h[0]*255),Math.round(h[1]*255),Math.round(h[2]*255)]),transparent:true,depthWrite:false,opacity:0.22}));
 const hb=big?4.6:3.4;hs.scale.set(hb,hb,1);grp.add(hs);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sigilTex(kind,label),transparent:true,depthWrite:false}));
 const sc=big?2.6:2.0;s.scale.set(sc,sc*1.1,1);grp.add(s);
 grp.position.set(x,y,z);scene.add(grp);
 return {s,hs,act:0,base:sc,hbase:hb,x,y,z,region};}
const NODES=[
['CHOOSING',0,2.6,-0.4,4,'core',0],
['TIME',-1.8,6.4,-0.5,10,'core',0],['NEEDS',1.8,6.2,0.5,1,'core',0],['SLEEP GATE',0,4.8,-1,3,'core',0],['DREAM',-2.8,5.4,1.2,13,'mem',0],
['SAFETY',-3.4,2.2,-1.5,0,'feel',0],['APPRAISAL',-5.4,-0.6,-1.2,5,'feel',1],['ATTENTION',-4.4,1.0,0.8,0,'feel',0],['FEELINGS',-6.6,-2.0,0.4,15,'feel',1],['HOST',-6.8,0.4,1.4,15,'feel',0],['TEN',-4.8,-2.8,-1.6,12,'self',0],
['WORDS',4.8,1.4,-1.0,9,'lang',1],['LEARNING',6.4,0.2,0.2,2,'lang',1],['SPACE',5.6,2.8,0.8,3,'lang',0],['COMPREHEND',7.0,2.0,-1.2,5,'lang',0],['VOICE',4.6,-0.8,1.4,9,'lang',1],['INTERPRETER',7.2,-1.4,0.4,14,'lang',0],['TELLERS',6.2,3.8,-0.4,10,'lang',0],['ECHO',5.6,-2.2,-0.8,9,'lang',0],
['THINKING',0.4,-4.6,-0.8,7,'think',1],['STORIES',2.0,-5.8,0.6,6,'think',0],['LESSONS',-1.2,-6.2,0.2,8,'think',0],['CURIOSITY',1.8,-3.2,1.4,2,'think',0],['INTERESTS',3.2,-4.4,-1.4,14,'think',0],['EVIDENCE',-2.4,-5.2,-1.4,10,'think',0],
['RECALL',-1.2,2.8,2.6,8,'mem',0],['MEMORY',-2.4,1.4,3.4,8,'mem',1],['COMMIT',0.4,1.6,3.8,8,'mem',0],['SLEEP',-1.6,3.6,4.2,10,'mem',0],
['SOUL',3.0,3.8,2.8,12,'self',1],['IDENTITY',4.2,4.8,1.6,15,'self',0],['GROWING',1.8,5.2,3.4,2,'self',0],['BEING',3.8,5.6,3.6,11,'self',0],
['BODY',0,-7.8,1.8,11,'body',1]
];
const nodes=NODES.map(n=>mk(n[1],n[2],n[3],n[4],n[0],n[5],n[6]===1));
const IDX={};NODES.forEach((n,i)=>IDX[n[0]]=i);
const SEQ=['TIME','NEEDS','SLEEP GATE','CHOOSING','WORDS','LEARNING','THINKING','RECALL','VOICE','COMMIT','ATTENTION','APPRAISAL','FEELINGS','EVIDENCE','BODY'];
const CONSULT={'SLEEP GATE':['DREAM'],'CHOOSING':['SAFETY','CURIOSITY','INTERESTS','SOUL'],'LEARNING':['TELLERS','SPACE'],'THINKING':['STORIES','LESSONS'],'RECALL':['MEMORY'],'VOICE':['COMPREHEND','ECHO'],'APPRAISAL':['HOST','TEN']};
const wire=new THREE.LineBasicMaterial({color:0x1c2c40,transparent:true,opacity:0.75});
for(let i=0;i<SEQ.length-1;i++){
 const a=nodes[IDX[SEQ[i]]],b=nodes[IDX[SEQ[i+1]]];
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x,a.y,a.z),new THREE.Vector3(b.x,b.y,b.z)]),wire));}
Object.keys(CONSULT).forEach(k=>CONSULT[k].forEach(v=>{
 const a=nodes[IDX[k]],b=nodes[IDX[v]];
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x,a.y,a.z),new THREE.Vector3(b.x,b.y,b.z)]),
 new THREE.LineBasicMaterial({color:0x14222f,transparent:true,opacity:0.7})));}));
const fb=nodes[IDX['FEELINGS']],cb=nodes[IDX['CHOOSING']];
const lpts=[];for(let i=0;i<=36;i++){const u=i/36;
 lpts.push(new THREE.Vector3(fb.x+(cb.x-fb.x)*u-Math.sin(u*Math.PI)*4,fb.y+(cb.y-fb.y)*u,fb.z+(cb.z-fb.z)*u-Math.sin(u*Math.PI)*2));}
const lline=new THREE.Line(new THREE.BufferGeometry().setFromPoints(lpts),new THREE.LineDashedMaterial({color:0x3a5a48,dashSize:0.3,gapSize:0.2,transparent:true,opacity:0.9}));
lline.computeLineDistances();scene.add(lline);
/* THE CORE: color = strongest feeling from his 22-palette (joy-gold shown); beat = arousal */
const FEEL=[255,216,115];
const coreG=new THREE.Group();
const coreLayers=[];
for(let i=0;i<5;i++){
 const cs=new THREE.Sprite(new THREE.SpriteMaterial({map:halo(FEEL),transparent:true,depthWrite:false,opacity:0.13}));
 const s=5.5+i*2.2;cs.scale.set(s,s*0.94,1);coreG.add(cs);coreLayers.push(cs);}
const inner=new THREE.Sprite(new THREE.SpriteMaterial({map:halo([255,236,170]),transparent:true,depthWrite:false,opacity:0.6}));
inner.scale.set(3.2,3.2,1);coreG.add(inner);coreLayers.push(inner);
coreG.position.set(0,-0.4,0.2);scene.add(coreG);
const starG=new THREE.BufferGeometry();const sp2=[];
for(let i=0;i<450;i++)sp2.push((Math.random()-0.5)*70,(Math.random()-0.5)*50,(Math.random()-0.5)*50-8);
starG.setAttribute('position',new THREE.Float32BufferAttribute(sp2,3));
scene.add(new THREE.Points(starG,new THREE.PointsMaterial({color:0x142236,size:0.08})));
const pulse=new THREE.Sprite(new THREE.SpriteMaterial({map:halo([180,255,215]),transparent:true,depthWrite:false}));
pulse.scale.set(1.3,1.3,1);scene.add(pulse);
let ph={leg:0,f:0,mode:'leg',k:0,out:true},energy=0.4;
function lerpSet(a,b,f){pulse.position.set(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,a.z+(b.z-a.z)*f);}
function adv(){
 if(ph.mode==='leg'){
  const a=nodes[IDX[SEQ[ph.leg]]],b=nodes[IDX[SEQ[ph.leg+1]]];
  ph.f+=0.018;lerpSet(a,b,ph.f);
  if(ph.f>=1){ph.f=0;b.act=1;energy=Math.min(1,energy+0.1);
   const cs=CONSULT[SEQ[ph.leg+1]];
   if(cs&&cs.length){ph.mode='stub';ph.k=0;ph.out=true;}
   else if(ph.leg+1>=SEQ.length-1){ph.mode='loop';ph.f=0;}
   else ph.leg++;}
 }else if(ph.mode==='stub'){
  const anchor=nodes[IDX[SEQ[ph.leg+1]]],cs=CONSULT[SEQ[ph.leg+1]],st=nodes[IDX[cs[ph.k]]];
  ph.f+=0.03;
  if(ph.out)lerpSet(anchor,st,ph.f);else lerpSet(st,anchor,ph.f);
  if(ph.f>=1){ph.f=0;
   if(ph.out){st.act=1;energy=Math.min(1,energy+0.04);ph.out=false;}
   else{ph.k++;ph.out=true;
    if(ph.k>=cs.length){
     if(ph.leg+1>=SEQ.length-1){ph.mode='loop';ph.f=0;}
     else{ph.mode='leg';ph.leg++;}}}}
 }else{
  ph.f+=0.01;
  const idx=Math.min(lpts.length-1,Math.floor(ph.f*(lpts.length-1)));
  pulse.position.copy(lpts[idx]);
  if(ph.f>=1){nodes[IDX['CHOOSING']].act=1;nodes[IDX['TIME']].act=1;ph={leg:0,f:0,mode:'leg',k:0,out:true};}
 }
}
let rot=0.5,drag=false,lx=0,t=0;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-lx)*0.005;lx=e.clientX;}});
nodes[IDX['TIME']].act=1;
(function anim(){
 t+=0.016;adv();
 nodes.forEach(o=>{
  const a=o.act,h=HUES[o.region];
  if(a<=0.02){o.s.material.color.setRGB(0.5,0.55,0.65);o.hs.material.opacity=0.16;}
  else{o.s.material.color.setRGB(0.5+(h[0]-0.5)*a+0.12*a,0.55+(h[1]-0.55)*a+0.12*a,0.65+(h[2]-0.65)*a+0.12*a);
   o.hs.material.opacity=0.16+a*0.55;}
  const s=o.base*(1+a*0.28);o.s.scale.set(s,s*1.1,1);
  const hbs=o.hbase*(1+a*0.4);o.hs.scale.set(hbs,hbs,1);
  o.act=Math.max(0,o.act-0.01);
 });
 energy=Math.max(0.35,energy-0.0012);
 const beat=Math.pow(Math.max(0,Math.sin(t*1.9)),3)*0.16+Math.pow(Math.max(0,Math.sin(t*1.9-0.5)),6)*0.1;
 coreLayers.forEach((cl,i)=>{
  const inner_=(i===coreLayers.length-1);
  const base=inner_?3.2:5.5+i*2.2;
  const s=base*(1+beat)*(0.92+energy*0.3)*(1+Math.sin(t*0.7+i)*0.04);
  cl.scale.set(s,s*0.94,1);
  cl.material.opacity=(inner_?0.45:0.09)+energy*(inner_?0.3:0.12)+beat*(inner_?0.5:0.18);
 });
 coreG.rotation.z+=0.0007;
 if(!drag)rot+=0.0012;
 cam.position.set(Math.sin(rot)*17,0.4,Math.cos(rot)*17);
 cam.lookAt(0,-0.4,0);
 ren.render(scene,cam);
 requestAnimationFrame(anim);
})();
</script></body></html>
